name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.9
          tofu_wrapper: false
      - run: tofu fmt -check -recursive
      # CI has neither the PostHog key nor the state passphrase: it checks the configuration, it
      # never reads the (encrypted) state or plans against PostHog. The passphrase below only
      # satisfies the encryption block.
      - run: tofu init -backend=false -input=false && tofu validate
        env:
          TF_VAR_state_passphrase: validate-only-not-a-secret
